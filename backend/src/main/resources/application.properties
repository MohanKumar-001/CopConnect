spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/copconnect_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
server.port=9090
server.address=0.0.0.0
spring.jackson.mapper.accept-case-insensitive-enums=true

# JWT configuration
# JWT_SECRET must be a Base64-encoded key of at least 256 bits for HS256.
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
jwt.issuer=${JWT_ISSUER:copconnect-api}
jwt.audience=${JWT_AUDIENCE:copconnect-client}
